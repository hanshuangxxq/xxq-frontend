map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $request_uri $xxq_robots_tag {
    default "";
    ~*^/(login|register|profile)(/|$|\?)  "noindex, nofollow";
}

limit_req_zone "$binary_remote_addr $http_x_client_private_ip" zone=xxq_login:10m rate=30r/m;

server {
    listen       80 default_server;
    server_name  hanshauangxxq.cn www.hanshauangxxq.cn;

    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen       443 ssl default_server;
    http2        on;
    server_name  hanshauangxxq.cn www.hanshauangxxq.cn;

    root /home/ubuntu/xxq-frontend/dist;
    index index.html;

    ssl_certificate     /etc/nginx/hanshaungxxq.cn_bundle.pem;
    ssl_certificate_key /etc/nginx/hanshaungxxq.cn.key;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:xxqSSL:10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    server_tokens off;

    set $xxq_cache_control "no-cache";
    add_header Cache-Control           $xxq_cache_control always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options  "nosniff" always;
    add_header X-Frame-Options         "DENY" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag            $xxq_robots_tag always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-HOu65QZgkQ/OteFwaVzq3CjcuLFJKUTRB4biBIrpk/4=' 'sha256-ZQtH6D8i8wkYEFKFUDLzmICzbt3RIKpBdrmhjfdb9q8=' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    if ($request_method !~* ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
        return 405;
    }

    client_max_body_size 50m;

    gzip            on;
    gzip_min_length 1k;
    gzip_types      text/plain text/css application/json application/javascript image/svg+xml;
    gzip_vary       on;

    autoindex off;

    location = /version.json {
        try_files $uri =404;
    }

    location /assets/ {
        set $xxq_cache_control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico {
        set $xxq_cache_control "public, max-age=604800";
        try_files $uri =404;
    }

    location ~ ^/(og-image|og-image-en|logo)\.png$ {
        set $xxq_cache_control "public, max-age=604800";
        try_files $uri =404;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location ~* /\.(?!well-known(?:/|$)) {
        return 404;
    }

    location ~* \.(?:bak|conf|dist|old|orig|save|swo|swp|sql|log)$ {
        return 404;
    }

    location = /api/login {
        limit_req zone=xxq_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = / {
        try_files /landing.html =404;
    }

    location = /en { return 301 /en/; }

    location = /index.html {
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
