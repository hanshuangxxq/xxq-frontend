# XXQ 前端 Nginx 部署配置
#
# 使用方法:
#   1. 前端构建: pnpm build,将 dist/ 目录内的所有文件上传到下方 root 指定的目录。
#      SEO 文件(落地页/robots.txt/sitemap.xml)由 scripts/build-landing.mjs 依据
#      scripts/landing/ 下的内容数据生成到 public/,构建时随 public/ 自动并入 dist,
#      无需单独部署。站点域名在 scripts/landing/site.mjs 的 SITE_ORIGIN 一处配置
#      (当前 https://hanshauangxxq.cn),改域名后重跑生成器再重新构建即可
#   2. 将本文件复制为 /etc/nginx/conf.d/xxq.conf(或 sites-available 后软链)
#   3. 按需修改下方各处 TODO
#   4. nginx -t && nginx -s reload
#
# 如需 HTTPS: 建议用 certbot 自动签发证书并改写 listen/server 块,location 配置保持不变

# WebSocket 连接升级映射(/ws 代理所需)
# 注意: map 指令需位于 http 上下文;conf.d/*.conf 引入方式下放在文件顶部即可
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 登录/个人页的 X-Robots-Tag。SPA 外壳 index.html 已有 <meta name="robots" content="noindex">,
# 但 meta 要爬虫执行 JS 才读得到,这里补一个 HTTP 头做双保险。
#
# ★ 必须用 $request_uri 而不是 $uri:/login、/profile 会被 try_files 内部重定向到
#   /index.html,$uri 在 header filter 阶段已变成 /index.html,map 永远展开为空、
#   头根本不会发出。$request_uri 是原始请求 URI,不随内部重定向变化。
# 值为空串时 nginx 整个 header 不发出(headers filter 的 if (value.len) 判断),
# 所以 default "" 是正确写法,不会给全站挂上空头。
map $request_uri $xxq_robots_tag {
    default "";
    ~*^/(login|register|profile)(/|$|\?)  "noindex, nofollow";
}

server {
    listen       80 default_server;
    server_name  _;              # TODO: 替换为实际域名或服务器 IP

    root  /var/www/xxq;          # TODO: 替换为 dist 产物实际部署目录
    index index.html;

    # 上传大小上限:nginx 默认仅 1MB,头像上传/批量导入 Excel 会 413
    client_max_body_size 50m;

    gzip            on;
    gzip_min_length 1k;
    gzip_types      text/plain text/css application/json application/javascript image/svg+xml;

    # ==================== 缓存策略 ====================
    # 与前端版本自动更新机制(src/shared/utils/versionCheck.ts)配套:
    # index.html / version.json 每次回源校验,assets 带内容 hash 可长缓存

    # 版本检测文件:客户端启动与后台轮询时拉取它判断是否有新版本,必须实时
    location = /version.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Vite 构建产物(文件名带内容 hash):内容变化则文件名变化,可安全长缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # 缺失的静态资源直接 404,绝不能回退到 index.html(否则 JS 请求拿到 HTML)
        try_files $uri =404;
    }

    location = /favicon.ico {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # 分享卡片与品牌方图(由 scripts/build-og-image.py 生成)
    location ~ ^/(og-image|og-image-en|logo)\.png$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # ==================== 后端反向代理 ====================
    # TODO: 后端不在本机时,将 127.0.0.1:8080 替换为实际地址
    # 注意 proxy_pass 不带结尾斜杠:保持 /api、/ws 路径前缀原样转发给后端

    # REST API
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 排课生成、批量导入等耗时接口,放宽读超时
        proxy_read_timeout 300s;
    }

    # WebSocket
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 长连接保活,避免空闲连接被 nginx 提前断开
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ==================== SEO 静态落地页 ====================
    # 落地页源码在 public/ 下,构建时并入 dist,与应用同一 root:
    #   中文: public/landing.html   -> 由下方 location = / 返回
    #   英文: public/en/index.html  -> /en/ 经 location / 的 try_files $uri/ + index 命中
    #   附属: robots.txt / sitemap.xml / landing.css 为 dist 根下真实文件,直接命中
    # 精确匹配 location = / 优先级高于 SPA 兜底,互不影响

    # 中文落地页(精确匹配 /)
    # ★ 本段不可省略:缺少它时,/ 会经 index 指令命中 SPA 外壳 index.html,
    #   未登录访客随即被前端路由守卫弹到 /login——即"访问首页直接跳登录、
    #   落地页不生效"的根因。landing.html 虽然在 dist 里,但没有任何默认
    #   规则会把 / 映射到它。
    # 也可用一行替代本段:把 server 级 index 指令改为
    #   index landing.html index.html;
    # (目录索引按顺序先命中 landing.html;内部重定向到 /landing.html 后由
    #  location / 按 dist 内真实文件返回,不会再被 SPA 外壳接管)
    location = / {
        add_header Cache-Control "no-cache";
        try_files /landing.html =404;
    }

    # /en 无尾斜杠时补斜杠(规范化,利于 SEO 归一)
    location = /en { return 301 /en/; }

    # 落地页子目录(SEO 详情页:/about/、/features/course-selection/ 等 12 个)
    # 是 dist 下真实存在的目录,由下方 location / 的 try_files $uri/ 命中后交给
    # index 模块,再经 server 级 `index index.html;` 取到各目录内的 index.html,
    # 本段无需额外配置。这些 HTML 由 scripts/build-landing.mjs 生成,勿手改。
    #
    # ★ 新增落地页目录时,目录名不得与 SPA 顶层路由同名(profile、course、
    #   selection、scheduling、grades、scores、exams、practice、login、403 等)。
    #   目录存在时静态页会先接管请求,同名 SPA 路由将永久不可达。

    # ==================== SPA 入口 ====================
    # 应用外壳 index.html 已声明 <meta name="robots" content="noindex">:登录后的应用
    # 页面不参与搜索引擎收录,收录面仅上方静态落地页。因此 robots.txt 不得屏蔽应用
    # 路由——爬虫必须能读到该 noindex 声明(详见 public/robots.txt 注释)

    # 入口 HTML:不缓存,保证用户始终能拿到最新版本(配合版本检测)
    #
    # ★ X-Robots-Tag 必须写在本 location 内,不能只写在上方 location / 里:
    #   /login、/profile 等路径经 try_files 内部重定向后,最终生效的是本 location,
    #   且 add_header 是「本层写了就完全不继承上层」——若写在外层,到这里就被清空了。
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag  $xxq_robots_tag;
    }

    # 前端 history 路由兜底:未匹配到静态文件的路径一律回退 index.html
    # 注意:精确的 / 已被上方 SEO 落地页接管,不会走到这里
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
