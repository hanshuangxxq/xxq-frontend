# XXQ 前端 Nginx 部署配置
#
# 使用方法:
#   1. 前端构建: pnpm build,将 dist/ 目录内的所有文件上传到下方 root 指定的目录
#   2. 将本文件复制为 /etc/nginx/conf.d/xxq.conf(或 sites-available 后软链)
#   3. 按需修改下方三处 TODO
#   4. nginx -t && nginx -s reload
#
# 如需 HTTPS: 建议用 certbot 自动签发证书并改写 listen/server 块,location 配置保持不变

# WebSocket 连接升级映射(/ws 代理所需)
# 注意: map 指令需位于 http 上下文;conf.d/*.conf 引入方式下放在文件顶部即可
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen       80 default_server;
    server_name  _;              # TODO: 替换为实际域名或服务器 IP

    root  /var/www/xxq;          # TODO: 替换为 dist 产物实际部署目录
    index index.html;

    # 上传大小上限:nginx 默认仅 1MB,头像上传/批量导入 Excel 会 413
    client_max_body_size 50m;

    gzip            on;
    gzip_min_length 1k;
    gzip_types      text/plain text/css application/json application/javascript image/svg+xml;

    # ==================== 缓存策略 ====================
    # 与前端版本自动更新机制(src/shared/utils/versionCheck.ts)配套:
    # index.html / version.json 每次回源校验,assets 带内容 hash 可长缓存

    # 版本检测文件:客户端启动与后台轮询时拉取它判断是否有新版本,必须实时
    location = /version.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Vite 构建产物(文件名带内容 hash):内容变化则文件名变化,可安全长缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # 缺失的静态资源直接 404,绝不能回退到 index.html(否则 JS 请求拿到 HTML)
        try_files $uri =404;
    }

    location = /favicon.ico {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # ==================== 后端反向代理 ====================
    # TODO: 后端不在本机时,将 127.0.0.1:8080 替换为实际地址
    # 注意 proxy_pass 不带结尾斜杠:保持 /api、/ws 路径前缀原样转发给后端

    # REST API
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 排课生成、批量导入等耗时接口,放宽读超时
        proxy_read_timeout 300s;
    }

    # WebSocket
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 长连接保活,避免空闲连接被 nginx 提前断开
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ==================== SPA 入口 ====================

    # 入口 HTML:不缓存,保证用户始终能拿到最新版本(配合版本检测)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 前端 history 路由兜底:未匹配到静态文件的路径一律回退 index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
