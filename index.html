<!DOCTYPE html>
<!--
  应用外壳(SPA 入口)。Nginx 对 / 与 /en/ 之外的地址一律返回本文件(见 deploy/nginx.conf),
  而这些地址全部是登录后的应用页面,故统一声明 noindex:SEO 收录面由 deploy/landing
  下的静态落地页承担。本文件的 meta 只服务于浏览器/读屏语义与链接分享预览(og),
  请勿在此堆砌关键词。<html lang> 为默认语言中文,应用挂载后由 useDocumentHead
  (src/shared/composables/useDocumentHead.ts)按实际界面语言与路由同步 <title>/lang
-->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XXQ — 高校教务管理系统</title>
    <meta
      name="description"
      content="XXQ 高校教务管理系统:覆盖选课、排课、培养方案、成绩与考试、毕业设计、实习竞赛等实践教学的一体化教学管理平台。本页为系统应用入口,需登录后使用。"
    >
    <!-- 应用页面均需登录,不参与搜索引擎收录;落地页(deploy/landing)才是收录面 -->
    <meta name="robots" content="noindex">
    <!-- 与下方内联样式/splash 的明暗背景一致,供浏览器 UI(标签栏等)取色 -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f6f8">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101014">
    <!-- 链接分享预览:应用页统一展示站点级信息,不逐页生成。
         og:image 用与落地页同一张品牌分享卡(由 scripts/build-og-image.py 生成),
         必须是绝对 URL -->
    <meta property="og:site_name" content="XXQ">
    <meta property="og:type" content="website">
    <meta property="og:title" content="XXQ — 高校教务管理系统">
    <meta
      property="og:description"
      content="面向高校的一体化教务管理系统:选课、排课、培养方案、成绩与考试、毕业设计与实践教学,学生、教师、院系、教务四端协同。"
    >
    <meta property="og:image" content="https://hanshauangxxq.cn/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="XXQ 高校教务管理系统 — 一体化教学管理平台">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://hanshauangxxq.cn/og-image.png">
    <link rel="icon" href="/favicon.ico">
    <style>
      /* 应用挂载前的兜底背景,与 global.css 的 --app-bg 一致,避免加载期白闪;
         暗色由下方内联脚本按本机存储的主题(无则跟随系统)预设 .dark 类决定 */
      html {
        background: #f5f6f8;
      }
      html.dark {
        background: #101014;
      }

      /* ===== 启动 splash(首屏加载指示) =====
         必须内联且零依赖:它要在 JS bundle 下载/解析、启动版本校验、偏好拉取
         完成之前就渲染,依赖任何外部资源都会重新产生空白期。
         颜色与 global.css 的语义变量保持一致,暗色由 <html> 的 .dark 类切换;
         应用挂载完成后由 main.ts 淡出移除 */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f6f8;
        transition: opacity 0.25s ease;
      }
      html.dark #boot-splash {
        background: #101014;
      }
      #boot-splash.boot-splash-leaving {
        opacity: 0;
        pointer-events: none;
      }
      .boot-splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      .boot-splash-brand {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.2em;
        color: #1f2329;
      }
      html.dark .boot-splash-brand {
        color: #e5e7eb;
      }
      .boot-splash-spinner {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 3px solid rgba(37, 99, 235, 0.2);
        border-top-color: #2563eb;
        animation: boot-splash-spin 0.8s linear infinite;
      }
      html.dark .boot-splash-spinner {
        border-color: rgba(59, 130, 246, 0.25);
        border-top-color: #3b82f6;
      }
      .boot-splash-text {
        font-size: 13px;
        color: #6b7280;
      }
      html.dark .boot-splash-text {
        color: #9ca3af;
      }
      @keyframes boot-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash-spinner {
          animation-duration: 1.6s;
        }
      }
    </style>
    <script>
      // 首帧防闪屏:样式与业务脚本加载前,按 localStorage 中用户主动设置的主题
      // (未设置则跟随系统)预设 <html> 的 dark 类,与 useThemeStore 保持一致
      ;(function () {
        try {
          var m = localStorage.getItem('xxq-theme')
          var dark =
            m === 'dark' ||
            (m !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {
          if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark')
          }
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <!-- 启动 splash:浏览器解析到此处即渲染(早于一切 JS),
         覆盖 bundle 加载、版本校验、偏好拉取的整个启动空窗;
         应用挂载完成后由 main.ts 淡出移除 -->
    <div id="boot-splash" role="status" aria-live="polite">
      <div class="boot-splash-inner">
        <div class="boot-splash-brand">XXQ</div>
        <div class="boot-splash-spinner" aria-hidden="true"></div>
        <div class="boot-splash-text">加载中…</div>
      </div>
    </div>
    <script>
      // splash 文案跟随浏览器语言(此刻 i18n 尚未加载,仅区分中文/其他)
      ;(function () {
        try {
          if (!(navigator.language || '').toLowerCase().startsWith('zh')) {
            var t = document.querySelector('#boot-splash .boot-splash-text')
            if (t) t.textContent = 'Loading…'
          }
        } catch (e) {
          /* 文案保持默认中文 */
        }
      })()
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
